# Fragments in conf.d/ are loaded in lexical order after the main file.
# They may define notifications and monitors, never settings.
version: 1

monitors:
  - name: api-health
    type: http
    enabled: true
    url: https://example.org/health
    method: GET
    timeout: 10s
    check_interval: 30s
    expect:
      status_codes:
        - 200
      body_contains: healthy
    failure_policy:
      consecutive_failures: 3
      recovery_after_successes: 2
    notifications:
      - main-webhook
