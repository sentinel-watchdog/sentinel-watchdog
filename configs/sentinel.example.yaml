# Sentinel example configuration.
# Reference: docs/configuration.md
#
# Secrets are never written here: they are read from the environment with
# ${VARIABLE}. Under systemd, provide them with an EnvironmentFile=
# readable only by root (see docs/configuration.md#secrets).
version: 1

settings:
  state_file: /var/lib/sentinel/state.json
  socket: /run/sentinel/sentinel.sock
  socket_mode: "0660"
  socket_group: sentinel
  log_level: info
  log_format: auto
  timezone: Europe/Rome
  default_check_interval: 15s
  default_command_timeout: 5m
  daemon_notifications:
    - main-webhook

notifications:
  - name: main-webhook
    type: webhook
    enabled: true
    url: ${SENTINEL_WEBHOOK_URL}
    method: POST
    timeout: 10s
    headers:
      Content-Type: application/json
      Authorization: Bearer ${SENTINEL_WEBHOOK_TOKEN}
    retry:
      attempts: 3
      delay: 5s
      backoff: exponential
      max_delay: 1m

monitors:
  # An existing systemd service. Sentinel only reads its state and, if
  # recovery.action is restart, runs `systemctl restart`.
  - name: mycustom
    type: systemd
    enabled: true
    service: mycustom.service
    check_interval: 15s
    recovery:
      enabled: true
      action: restart
      max_attempts: 5
      window: 10m
      delay: 10s
      backoff: exponential
      max_delay: 5m
      stable_after: 15m
    notifications:
      - main-webhook

  # A foreground process supervised by Sentinel. `command` is executed
  # directly: no shell, no $PATH lookup.
  - name: worker
    type: process
    enabled: true
    command: /opt/myapp/bin/worker
    args:
      - --config
      - /etc/myapp/worker.yaml
    user: myapp
    group: myapp
    working_directory: /opt/myapp
    environment:
      APP_ENV: production
    stdout:
      type: file
      path: /var/log/myapp/worker.log
    stderr:
      type: file
      path: /var/log/myapp/worker-error.log
    health:
      startup_grace_period: 30s
      check_interval: 5s
      stop_signal: SIGTERM
      stop_timeout: 30s
    limits:
      max_cpu_percent: 80
      max_memory_bytes: 1GiB
      sustained_for: 1m
      action: restart
    recovery:
      enabled: true
      action: restart
      max_attempts: 5
      window: 10m
      delay: 5s
      backoff: exponential
      max_delay: 5m
      stable_after: 15m
    notifications:
      - main-webhook

  # A scheduled job (traditional 5-field cron syntax).
  - name: nightly-backup
    type: cron
    enabled: true
    schedule: "0 2 * * *"
    command: /usr/local/bin/backup.sh
    user: backup
    working_directory: /var/lib/backup
    timeout: 2h
    concurrency_policy: forbid
    stdout:
      type: file
      path: /var/log/sentinel/nightly-backup.log
    stderr:
      type: file
      path: /var/log/sentinel/nightly-backup-error.log
    notifications:
      channels:
        - main-webhook
      events:
        - job_succeeded
        - job_failed
        - job_timeout

# More monitors can live in conf.d/*.yaml (see conf.d/10-http.yaml).
#
# Planned, not yet implemented (rejected by validation in this release):
#   type: mount | port | log | resource | openrc | process_group
