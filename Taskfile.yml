# Sentinel task runner — https://taskfile.dev (go-task v3).
# Run `task --list` for the available tasks.
version: "3"

vars:
  MODULE: github.com/sentinel-watchdog/sentinel-watchdog
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  # Reproducible builds: honour SOURCE_DATE_EPOCH, else use the last commit date.
  # Always UTC: format-local follows TZ, so TZ=UTC keeps the "Z" true.
  DATE:
    sh: |
      if [ -n "${SOURCE_DATE_EPOCH:-}" ]; then
        date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r "${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ
      else
        TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown
      fi
  # The same instant in seconds, for file times in snapshot archives.
  EPOCH:
    sh: echo "${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct 2>/dev/null || echo 0)}"
  LDFLAGS: >-
    -s -w
    -X {{.MODULE}}/internal/version.Version={{.VERSION}}
    -X {{.MODULE}}/internal/version.Commit={{.COMMIT}}
    -X {{.MODULE}}/internal/version.Date={{.DATE}}
  GOLANGCI_LINT: golangci-lint
  # Tool versions: keep in sync with .github/workflows/ci.yml.
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.30.1
  # Release snapshot tools (D-079): run with `go run`, so CI only pins task.
  GORELEASER_VERSION: v2.18.3
  CYCLONEDX_GOMOD_VERSION: v1.12.0
  # Images for test-linux (glibc and musl).
  GO_IMAGE_GLIBC: golang:1.27
  GO_IMAGE_MUSL: golang:1.27-alpine

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format Go code (gofmt -s + goimports via golangci-lint)
    cmds:
      - gofmt -s -w .
      - "{{.GOLANGCI_LINT}} fmt"

  fmt-check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        out=$(gofmt -s -l .)
        if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (v2)
    cmds:
      - "{{.GOLANGCI_LINT}} run ./..."

  test:
    desc: Run unit tests
    cmds:
      - go test -count=1 ./...

  test-race:
    desc: Run unit tests with the race detector
    env:
      CGO_ENABLED: "1" # the race detector requires cgo
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests with coverage and write coverage.html
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1
      - go tool cover -html=coverage.out -o coverage.html

  vuln:
    desc: Scan dependencies for known vulnerabilities (govulncheck)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  lint-actions:
    desc: Lint GitHub Actions workflows (actionlint + zizmor; zizmor needs uv)
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
      - uvx zizmor=={{.ZIZMOR_VERSION}} --offline --persona=auditor .github/workflows

  test-linux:
    desc: Run unit tests in Linux containers as a non-root user (glibc with race detector, musl); works with local or remote Docker contexts
    vars:
      # Tracked and untracked (not ignored) files, streamed as a tar archive
      # on stdin: no bind mount, so a remote Docker host works too.
      SOURCES: >-
        git ls-files -z --cached --others --exclude-standard |
        COPYFILE_DISABLE=1 tar --no-xattrs --null -T - -cf -
      DOCKER_RUN: >-
        docker run --rm -i --user 10001:10001
        -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod
        -e GOFLAGS=-buildvcs=false -e GOTOOLCHAIN=local
      IN_CONTAINER: mkdir -p /tmp/src && tar -xf - -C /tmp/src && cd /tmp/src &&
    cmds:
      - 'echo "Docker engine: $(docker context inspect --format "{{"{{"}}.Endpoints.docker.Host{{"}}"}}")"'
      - "{{.SOURCES}} | {{.DOCKER_RUN}} -e CGO_ENABLED=1 {{.GO_IMAGE_GLIBC}} sh -c '{{.IN_CONTAINER}} go test -race -count=1 ./...'"
      - "{{.SOURCES}} | {{.DOCKER_RUN}} -e CGO_ENABLED=0 {{.GO_IMAGE_MUSL}} sh -c '{{.IN_CONTAINER}} go test -count=1 ./...'"

  test-vm:
    desc: Run the root integration tests (tests/integration, build tag integration) on a disposable Linux VM over SSH, HOST=<ssh host> [SSH_CONFIG=<file>] (D-056); the VM needs no Go toolchain, only sudo
    requires:
      vars: [HOST]
    env:
      HOST: "{{.HOST}}"
      # An ssh_config for VMs behind a jump host, instead of ~/.ssh/config.
      SSH_CONFIG: "{{.SSH_CONFIG}}"
    cmds:
      - |
        set -eu
        case "$HOST" in -*|*[!A-Za-z0-9._@-]*) echo "test-vm: HOST must be an ssh host name" >&2; exit 2;; esac
        if [ -n "${SSH_CONFIG:-}" ]; then
          case "$SSH_CONFIG" in *[!A-Za-z0-9._/-]*) echo "test-vm: SSH_CONFIG must be a plain path" >&2; exit 2;; esac
          set -- -F "$SSH_CONFIG"
        fi
        case "$(ssh "$@" -- "$HOST" uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "test-vm: unsupported architecture" >&2; exit 2 ;;
        esac
        export CGO_ENABLED=0 GOOS=linux GOARCH=$arch  # discovery too: the suites are linux-only
        out=dist/itest/$arch
        rm -rf "$out" && mkdir -p "$out"
        pkgs=$(go list -tags integration ./tests/integration/...)
        [ -n "$pkgs" ] || { echo "test-vm: no integration test packages" >&2; exit 1; }
        for pkg in $pkgs; do
          go test -c -tags integration -o "$out/$(basename "$pkg").test" "$pkg"
        done
        remote=$(ssh "$@" -- "$HOST" mktemp -d /tmp/sentinel-itest.XXXXXX)
        trap 'ssh "$@" -- "$HOST" sudo rm -rf "$remote"' EXIT
        scp -q "$@" "$out"/*.test "$HOST:$remote/"
        status=0
        for bin in "$out"/*.test; do
          name=$(basename "$bin")
          echo "== $HOST ($arch): $name"
          ssh "$@" -- "$HOST" "cd $remote && sudo timeout 10m ./$name -test.v -test.count=1" || status=1
        done
        exit $status

  dev-shell:
    desc: Open a shell in the dev container (Linux, Go, task, golangci-lint) with a copy of the sources, on the current Docker context or DOCKER_CONTEXT=<name>; changes made inside are not copied back
    interactive: true
    vars:
      IMAGE: sentinel-watchdog-dev
      # As in test-linux: tracked and untracked (not ignored) files as a tar
      # stream, so a remote Docker host works too.
      SOURCES: >-
        git ls-files -z --cached --others --exclude-standard |
        COPYFILE_DISABLE=1 tar --no-xattrs --null -T - -cf -
    cmds:
      - 'echo "Docker engine: $(docker context inspect --format "{{"{{"}}.Endpoints.docker.Host{{"}}"}}")"'
      - docker build -q -t {{.IMAGE}} .devcontainer
      - |
        set -o pipefail  # a failure while listing or archiving the sources stops here
        id=$(docker run -d {{.IMAGE}} sleep infinity)
        trap 'docker rm -f "$id" >/dev/null' EXIT
        # Extracted by the dev user itself: the files are its own whatever the
        # host uid and modes (a 0600 file stays readable).
        docker exec "$id" mkdir /home/dev/src
        {{.SOURCES}} | docker exec -i "$id" tar -xf - -C /home/dev/src
        docker exec -w /home/dev/src "$id" go mod download
        docker exec -it -w /home/dev/src "$id" bash

  fuzz:
    desc: Run every Fuzz* target for FUZZTIME each (default 10s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "10s"}}'
    cmds:
      - |
        set -e
        # Assignments, not `for x in $(cmd)`: a failing go command stops the task.
        pkgs=$(go list ./...)
        for pkg in $pkgs; do
          targets=$(go test -list '^Fuzz' "$pkg")
          for target in $(printf '%s\n' "$targets" | grep '^Fuzz' || true); do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime {{.FUZZTIME | shellQuote}} "$pkg"
          done
        done

  labels:
    desc: Create or update the repository labels on GitHub (needs gh and write access)
    silent: true
    cmds:
      - for:
          - "bug|d73a4a|Something does not work as documented"
          - "enhancement|a2eeef|New feature or improvement"
          - "documentation|0075ca|Documentation only"
          - "security|b60205|Security hardening or vulnerability fix"
          - "dependencies|0366d6|Dependency updates"
          - "ci|5319e7|CI, workflows and repository automation"
          - "module:core|1d76db|Core: config, events, state, notifications, socket, CLI"
          - "module:supervisor|0e8a16|Supervisor module"
          - "module:firewall|e99695|Firewall module"
          - "needs-decision|fbca04|Blocked on a design decision (ADR or decision log)"
          - "good first issue|7057ff|Small, well-scoped task for newcomers"
        cmd: |
          IFS='|' read -r name color desc <<'LABEL'
          {{.ITEM}}
          LABEL
          gh label create "$name" --color "$color" --description "$desc" --force
          echo "label: $name"

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  tidy-check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  build:
    desc: Compile all packages with the release ldflags (binaries are built by snapshot)
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" ./...

  snapshot-tools:
    desc: Build GoReleaser (cached by go run) and install cyclonedx-gomod in bin/tools; snapshot then runs offline
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} --version >/dev/null
      - GOBIN="{{.ROOT_DIR}}/bin/tools" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@{{.CYCLONEDX_GOMOD_VERSION}}

  snapshot-check:
    desc: Validate .goreleaser.yaml
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} check

  snapshot:
    desc: Build release-shaped archives, checksums and SBOMs into dist/ (linux amd64 and arm64; nothing is published)
    env: &release_env
      SENTINEL_VERSION: "{{.VERSION}}"
      SENTINEL_COMMIT: "{{.COMMIT}}"
      SENTINEL_DATE: "{{.DATE}}"
      SOURCE_DATE_EPOCH: "{{.EPOCH}}"
    cmds:
      - task: snapshot-tools
      - task: snapshot-check
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} release --snapshot --clean
      - task: snapshot-verify

  snapshot-verify:
    desc: Check dist/ from snapshot - archives, contents, architectures, checksums, SBOMs, embedded version
    env: *release_env
    cmds:
      - |
        set -eu
        cd dist
        fail() { echo "snapshot-verify: $*" >&2; exit 1; }
        version="${SENTINEL_VERSION}-snapshot"
        shasum -a 256 -c checksums.txt >/dev/null || fail "checksums do not match"
        [ "$(ls *.tar.gz | wc -l)" -eq 2 ] || fail "want 2 archives: $(ls *.tar.gz)"
        for arch in amd64 arm64; do
          case $arch in amd64) elf="x86-64" machine="x86_64" ;; arm64) elf="aarch64" machine="aarch64" ;; esac
          name="sentinel-watchdog_${version}_linux_${arch}"
          grep -q " ${name}.tar.gz\$" checksums.txt || fail "${name}.tar.gz not in checksums.txt"
          rm -rf "verify-${arch}" && mkdir "verify-${arch}"
          tar -xzf "${name}.tar.gz" -C "verify-${arch}"
          for f in sentineld sentinelctl LICENSE README.md CHANGELOG.md examples/sentinel.yaml; do
            [ -f "verify-${arch}/${name}/${f}" ] || fail "${name}: ${f} missing"
          done
          for bin in sentineld sentinelctl; do
            path="verify-${arch}/${name}/${bin}"
            file "$path" | grep -q "ELF 64-bit.*${elf}.*statically linked" || fail "${bin} ${arch}: $(file -b "$path")"
            # The version line `task build` links: run where the binary is
            # native (CI), else look for the version in its data (-trimpath
            # keeps -ldflags out of the build information).
            want="${bin} ${SENTINEL_VERSION} (commit ${SENTINEL_COMMIT}, built ${SENTINEL_DATE})"
            case $bin in sentineld) ask="-version" ;; sentinelctl) ask="version" ;; esac
            if [ "$(uname -s)/$(uname -m)" = "Linux/${machine}" ]; then
              [ "$("$path" "$ask")" = "$want" ] || fail "${bin} ${arch}: ${ask} is not \"${want}\""
            else
              LC_ALL=C grep -aq -- "${SENTINEL_VERSION}" "$path" || fail "${bin} ${arch}: version ${SENTINEL_VERSION} not linked"
            fi
            sbom="${bin}_${version}_linux_${arch}.cdx.json"
            jq -e --arg main "github.com/sentinel-watchdog/sentinel-watchdog" --arg target "goarch=${arch}&goos=linux" '
              .bomFormat == "CycloneDX"
              and .metadata.component.name == $main
              and (.metadata.component.purl | contains($target))
              and ([.components[].name] | index("go.yaml.in/yaml/v3") != null)
              and all(.components[]; .purl | contains($target))
            ' "$sbom" >/dev/null || fail "${sbom}: not a CycloneDX SBOM of ${bin} for linux/${arch} with its modules"
            # The generator's own hashes depend on the host that built it.
            jq -e '[.metadata.tools[]? | .hashes] | all(. == null)' "$sbom" >/dev/null \
              || fail "${sbom}: carries the generator's hashes (host-dependent)"
          done
          rm -rf "verify-${arch}"
        done
        echo "snapshot-verify: ok ($(ls *.tar.gz | tr '\n' ' '))"

  check:
    desc: Offline CI checks (format, tidy, vet, lint, tests, race, build); network checks are vuln and lint-actions
    cmds:
      - task: fmt-check
      - task: tidy-check
      - task: vet
      - task: lint
      - task: test
      - task: test-race
      - task: build

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin dist coverage.out coverage.html
