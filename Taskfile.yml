# Sentinel task runner — https://taskfile.dev (go-task v3).
# Run `task --list` for the available tasks.
version: "3"

vars:
  MODULE: github.com/sentinel-watchdog/sentinel-watchdog
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  # Reproducible builds: honour SOURCE_DATE_EPOCH, else use the last commit date.
  DATE:
    sh: |
      if [ -n "${SOURCE_DATE_EPOCH:-}" ]; then
        date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r "${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ
      else
        git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown
      fi
  LDFLAGS: >-
    -s -w
    -X {{.MODULE}}/internal/version.Version={{.VERSION}}
    -X {{.MODULE}}/internal/version.Commit={{.COMMIT}}
    -X {{.MODULE}}/internal/version.Date={{.DATE}}
  GOLANGCI_LINT: golangci-lint
  # Tool versions: keep in sync with .github/workflows/ci.yml.
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.30.1
  # Images for test-linux (glibc and musl).
  GO_IMAGE_GLIBC: golang:1.27
  GO_IMAGE_MUSL: golang:1.27-alpine

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format Go code (gofmt -s + goimports via golangci-lint)
    cmds:
      - gofmt -s -w .
      - "{{.GOLANGCI_LINT}} fmt"

  fmt-check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        out=$(gofmt -s -l .)
        if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (v2)
    cmds:
      - "{{.GOLANGCI_LINT}} run ./..."

  test:
    desc: Run unit tests
    cmds:
      - go test -count=1 ./...

  test-race:
    desc: Run unit tests with the race detector
    env:
      CGO_ENABLED: "1" # the race detector requires cgo
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests with coverage and write coverage.html
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1
      - go tool cover -html=coverage.out -o coverage.html

  vuln:
    desc: Scan dependencies for known vulnerabilities (govulncheck)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  lint-actions:
    desc: Lint GitHub Actions workflows (actionlint + zizmor; zizmor needs uv)
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
      - uvx zizmor=={{.ZIZMOR_VERSION}} --offline --persona=auditor .github/workflows

  test-linux:
    desc: Run unit tests in Linux containers as a non-root user (glibc with race detector, musl); works with local or remote Docker contexts
    vars:
      # Tracked and untracked (not ignored) files, streamed as a tar archive
      # on stdin: no bind mount, so a remote Docker host works too.
      SOURCES: >-
        git ls-files -z --cached --others --exclude-standard |
        COPYFILE_DISABLE=1 tar --no-xattrs --null -T - -cf -
      DOCKER_RUN: >-
        docker run --rm -i --user 10001:10001
        -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod
        -e GOFLAGS=-buildvcs=false -e GOTOOLCHAIN=local
      IN_CONTAINER: mkdir -p /tmp/src && tar -xf - -C /tmp/src && cd /tmp/src &&
    cmds:
      - 'echo "Docker engine: $(docker context inspect --format "{{"{{"}}.Endpoints.docker.Host{{"}}"}}")"'
      - "{{.SOURCES}} | {{.DOCKER_RUN}} -e CGO_ENABLED=1 {{.GO_IMAGE_GLIBC}} sh -c '{{.IN_CONTAINER}} go test -race -count=1 ./...'"
      - "{{.SOURCES}} | {{.DOCKER_RUN}} -e CGO_ENABLED=0 {{.GO_IMAGE_MUSL}} sh -c '{{.IN_CONTAINER}} go test -count=1 ./...'"

  fuzz:
    desc: Run every Fuzz* target for FUZZTIME each (default 10s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "10s"}}'
    cmds:
      - |
        set -e
        # Assignments, not `for x in $(cmd)`: a failing go command stops the task.
        pkgs=$(go list ./...)
        for pkg in $pkgs; do
          targets=$(go test -list '^Fuzz' "$pkg")
          for target in $(printf '%s\n' "$targets" | grep '^Fuzz' || true); do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime {{.FUZZTIME | shellQuote}} "$pkg"
          done
        done

  labels:
    desc: Create or update the repository labels on GitHub (needs gh and write access)
    silent: true
    cmds:
      - for:
          - "bug|d73a4a|Something does not work as documented"
          - "enhancement|a2eeef|New feature or improvement"
          - "documentation|0075ca|Documentation only"
          - "security|b60205|Security hardening or vulnerability fix"
          - "dependencies|0366d6|Dependency updates"
          - "ci|5319e7|CI, workflows and repository automation"
          - "module:core|1d76db|Core: config, events, state, notifications, socket, CLI"
          - "module:supervisor|0e8a16|Supervisor module"
          - "module:firewall|e99695|Firewall module"
          - "needs-decision|fbca04|Blocked on a design decision (ADR or decision log)"
          - "good first issue|7057ff|Small, well-scoped task for newcomers"
        cmd: |
          IFS='|' read -r name color desc <<'LABEL'
          {{.ITEM}}
          LABEL
          gh label create "$name" --color "$color" --description "$desc" --force
          echo "label: $name"

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  tidy-check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  build:
    desc: Compile all packages (binaries are added in Phase 2c)
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" ./...

  check:
    desc: Offline CI checks (format, tidy, vet, lint, tests, race, build); network checks are vuln and lint-actions
    cmds:
      - task: fmt-check
      - task: tidy-check
      - task: vet
      - task: lint
      - task: test
      - task: test-race
      - task: build

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin dist coverage.out coverage.html
