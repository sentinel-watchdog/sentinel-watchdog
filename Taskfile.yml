# Sentinel task runner: https://taskfile.dev (go-task v3).
# Run `task --list` for the available tasks.
version: "3"

vars:
  MODULE: github.com/sentinel-watchdog/sentinel-watchdog
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  # Reproducible builds: honour SOURCE_DATE_EPOCH, else use the last commit date.
  # Always UTC: format-local follows TZ, so TZ=UTC keeps the "Z" true.
  DATE:
    sh: |
      if [ -n "${SOURCE_DATE_EPOCH:-}" ]; then
        date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r "${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ
      else
        TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown
      fi
  # Package version (D-102, packaging/pkg-version.sh): the tag without "v"
  # on a tagged, clean commit, else the next patch with "-pre<commits since
  # the tag>", which dpkg, rpm and apk accept and order (deb 0.3.1~pre5,
  # rpm 0.3.1~pre5-1, apk 0.3.1_pre5).
  PKG_VERSION:
    # Release tags only (digits and dots after "v"): prerelease or build tags
    # (v1.0.0-rc.1, v1.0.0+b1) are not versions apk can order, so snapshots
    # describe from the last release tag.
    sh: sh packaging/pkg-version.sh "$(git describe --tags --match 'v[0-9]*' --exclude 'v*[!0-9.]*' --long --dirty 2>/dev/null || true)"
  # The same instant in seconds, for file times in snapshot archives.
  EPOCH:
    sh: echo "${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct 2>/dev/null || echo 0)}"
  LDFLAGS: >-
    -s -w
    -X {{.MODULE}}/internal/version.Version={{.VERSION}}
    -X {{.MODULE}}/internal/version.Commit={{.COMMIT}}
    -X {{.MODULE}}/internal/version.Date={{.DATE}}
  # Tool versions: keep in sync with .github/workflows/ci.yml (and
  # GOLANGCI_LINT_VERSION with .devcontainer/Dockerfile).
  GOLANGCI_LINT_VERSION: v2.15.0
  # The pinned version, not whatever is installed: local lint must find
  # what CI finds.
  GOLANGCI_LINT: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.30.1
  # Release snapshot tools (D-079): run with `go run`, so CI only pins task.
  GORELEASER_VERSION: v2.18.3
  CYCLONEDX_GOMOD_VERSION: v1.12.0
  # Images for test-linux (glibc and musl).
  GO_IMAGE_GLIBC: golang:1.27
  GO_IMAGE_MUSL: golang:1.27-alpine
  # Images for the package script tests (D-102): Debian for deb and rpm
  # scripts (dash), Alpine for apk scripts (busybox ash). Pinned by digest.
  PACKAGE_IMAGE_DEBIAN: debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6  # also the base of tests/packaging/Dockerfile
  PACKAGE_IMAGE_ALPINE: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f

  # The working tree's files (tracked and untracked, not ignored) as a tar
  # stream on stdout: what containers and clean copies receive, with no bind
  # mount. Append paths to limit it: {{.TREE}} -- packaging
  TREE: git ls-files -z --cached --others --exclude-standard
  TAR: COPYFILE_DISABLE=1 tar --no-xattrs --null -T - -cf -
  SHFMT_VERSION: v3.13.1

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format Go code (gofmt -s + goimports via golangci-lint)
    cmds:
      - gofmt -s -w .
      - "{{.GOLANGCI_LINT}} fmt"

  fmt-check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        out=$(gofmt -s -l .)
        if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (v2)
    cmds:
      - "{{.GOLANGCI_LINT}} run ./..."

  test:
    desc: Run unit tests
    cmds:
      - go test -count=1 ./...

  test-race:
    desc: Run unit tests with the race detector
    env:
      CGO_ENABLED: "1" # the race detector requires cgo
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests with coverage and write coverage.html
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1
      - go tool cover -html=coverage.out -o coverage.html

  vuln:
    desc: Scan dependencies for known vulnerabilities (govulncheck)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  lint-actions:
    desc: Lint GitHub Actions workflows (actionlint + zizmor; zizmor needs uv)
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
      - uvx zizmor=={{.ZIZMOR_VERSION}} --offline --persona=auditor .github/workflows

  test-linux:
    desc: Run unit tests in Linux containers as a non-root user (glibc with race detector, musl); works with local or remote Docker contexts
    vars:
      # Tracked and untracked (not ignored) files, streamed as a tar archive
      # on stdin: no bind mount, so a remote Docker host works too.
      SOURCES: >-
        git ls-files -z --cached --others --exclude-standard |
        COPYFILE_DISABLE=1 tar --no-xattrs --null -T - -cf -
      DOCKER_RUN: >-
        docker run --rm -i --user 10001:10001
        -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod
        -e GOFLAGS=-buildvcs=false -e GOTOOLCHAIN=local
      IN_CONTAINER: mkdir -p /tmp/src && tar -xf - -C /tmp/src && cd /tmp/src &&
    cmds:
      - 'echo "Docker engine: $(docker context inspect --format "{{"{{"}}.Endpoints.docker.Host{{"}}"}}")"'
      - "{{.SOURCES}} | {{.DOCKER_RUN}} -e CGO_ENABLED=1 {{.GO_IMAGE_GLIBC}} sh -c '{{.IN_CONTAINER}} go test -race -count=1 ./...'"
      - "{{.SOURCES}} | {{.DOCKER_RUN}} -e CGO_ENABLED=0 {{.GO_IMAGE_MUSL}} sh -c '{{.IN_CONTAINER}} go test -count=1 ./...'"

  test-package-scripts:
    desc: Run the package maintainer scripts against stubbed system commands (tests/packaging/scripts_test.sh) as root in throwaway Debian and Alpine containers; works with local or remote Docker contexts
    vars:
      # Only the scripts and the test, streamed on stdin: no bind mount.
      SOURCES: "{{.TREE}} -- packaging tests/packaging | {{.TAR}}"
      IN_CONTAINER: >-
        mkdir -p /tmp/src && tar -xf - -C /tmp/src &&
        SENTINEL_DISPOSABLE_HOST=1 sh /tmp/src/tests/packaging/scripts_test.sh /tmp/src &&
        sh /tmp/src/tests/packaging/version_test.sh /tmp/src
    cmds:
      - 'echo "Docker engine: $(docker context inspect --format "{{"{{"}}.Endpoints.docker.Host{{"}}"}}")"'
      - "{{.SOURCES}} | docker run --rm -i --network none {{.PACKAGE_IMAGE_DEBIAN}} sh -c '{{.IN_CONTAINER}}'"
      - "{{.SOURCES}} | docker run --rm -i --network none {{.PACKAGE_IMAGE_ALPINE}} sh -c '{{.IN_CONTAINER}}'"

  vm:
    desc: Run vagrant on the VM matrix of tests/vm (D-085) with its state and generated files outside the repository, in SENTINEL_VM_DIR (default ~/.cache/sentinel-watchdog/vm); for example task vm -- up debian13
    vars: &vm_vars
      VM_DIR:
        sh: echo "${SENTINEL_VM_DIR:-$HOME/.cache/sentinel-watchdog/vm}"
    env: &vm_env
      VAGRANT_CWD: "{{.ROOT_DIR}}/tests/vm"
      VAGRANT_DOTFILE_PATH: "{{.VM_DIR}}/vagrant"
    cmds:
      - mkdir -p "{{.VM_DIR}}"
      - vagrant {{.CLI_ARGS}}

  vm-ssh-config:
    desc: Write the ssh_config of running VMs of the matrix to SENTINEL_VM_DIR/ssh_config, for task test-vm SSH_CONFIG=…; for example task vm-ssh-config -- debian13 rocky9
    vars: *vm_vars
    env: *vm_env
    cmds:
      - mkdir -p "{{.VM_DIR}}"
      - vagrant ssh-config {{.CLI_ARGS}} > "{{.VM_DIR}}/ssh_config"
      - echo "wrote {{.VM_DIR}}/ssh_config"

  test-vm:
    desc: Run the root integration tests (tests/integration, build tag integration) on a disposable Linux VM over SSH, HOST=<ssh host> [SSH_CONFIG=<file>] (D-056); the VM needs no Go toolchain, only sudo
    requires:
      vars: [HOST]
    env:
      HOST: "{{.HOST}}"
      # An ssh_config for VMs behind a jump host, instead of ~/.ssh/config.
      SSH_CONFIG: "{{.SSH_CONFIG}}"
    cmds:
      - |
        set -eu
        case "$HOST" in -*|*[!A-Za-z0-9._@-]*) echo "test-vm: HOST must be an ssh host name" >&2; exit 2;; esac
        if [ -n "${SSH_CONFIG:-}" ]; then
          case "$SSH_CONFIG" in *[!A-Za-z0-9._/-]*) echo "test-vm: SSH_CONFIG must be a plain path" >&2; exit 2;; esac
          set -- -F "$SSH_CONFIG"
        fi
        case "$(ssh "$@" -- "$HOST" uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "test-vm: unsupported architecture" >&2; exit 2 ;;
        esac
        export CGO_ENABLED=0 GOOS=linux GOARCH=$arch  # discovery too: the suites are linux-only
        out=dist/itest/$arch
        rm -rf "$out" && mkdir -p "$out"
        pkgs=$(go list -tags integration ./tests/integration/...)
        [ -n "$pkgs" ] || { echo "test-vm: no integration test packages" >&2; exit 1; }
        for pkg in $pkgs; do
          go test -c -tags integration -o "$out/$(basename "$pkg").test" "$pkg"
        done
        remote=$(ssh "$@" -- "$HOST" mktemp -d /tmp/sentinel-itest.XXXXXX)
        trap 'ssh "$@" -- "$HOST" sudo rm -rf "$remote"' EXIT
        scp -q "$@" "$out"/*.test "$HOST:$remote/"
        status=0
        for bin in "$out"/*.test; do
          name=$(basename "$bin")
          echo "== $HOST ($arch): $name"
          ssh "$@" -- "$HOST" "cd $remote && sudo timeout 10m ./$name -test.v -test.count=1" || status=1
        done
        exit $status

  dev-shell:
    desc: Open a shell in the dev container (Linux, Go, task, golangci-lint) with a copy of the sources, on the current Docker context or DOCKER_CONTEXT=<name>; changes made inside are not copied back
    interactive: true
    vars:
      IMAGE: sentinel-watchdog-dev
      # As in test-linux: tracked and untracked (not ignored) files as a tar
      # stream, so a remote Docker host works too.
      SOURCES: >-
        git ls-files -z --cached --others --exclude-standard |
        COPYFILE_DISABLE=1 tar --no-xattrs --null -T - -cf -
    cmds:
      - 'echo "Docker engine: $(docker context inspect --format "{{"{{"}}.Endpoints.docker.Host{{"}}"}}")"'
      - docker build -q -t {{.IMAGE}} .devcontainer
      - |
        set -o pipefail  # a failure while listing or archiving the sources stops here
        id=$(docker run -d {{.IMAGE}} sleep infinity)
        trap 'docker rm -f "$id" >/dev/null' EXIT
        # Extracted by the dev user itself: the files are its own whatever the
        # host uid and modes (a 0600 file stays readable).
        docker exec "$id" mkdir /home/dev/src
        {{.SOURCES}} | docker exec -i "$id" tar -xf - -C /home/dev/src
        docker exec -w /home/dev/src "$id" go mod download
        docker exec -it -w /home/dev/src "$id" bash

  fuzz:
    desc: Run every Fuzz* target for FUZZTIME each (default 10s)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "10s"}}'
    cmds:
      - |
        set -e
        # Assignments, not `for x in $(cmd)`: a failing go command stops the task.
        pkgs=$(go list ./...)
        for pkg in $pkgs; do
          targets=$(go test -list '^Fuzz' "$pkg")
          for target in $(printf '%s\n' "$targets" | grep '^Fuzz' || true); do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime {{.FUZZTIME | shellQuote}} "$pkg"
          done
        done

  labels:
    desc: Create or update the repository labels on GitHub (needs gh and write access)
    silent: true
    cmds:
      - for:
          - "bug|d73a4a|Something does not work as documented"
          - "enhancement|a2eeef|New feature or improvement"
          - "documentation|0075ca|Documentation only"
          - "security|b60205|Security hardening or vulnerability fix"
          - "dependencies|0366d6|Dependency updates"
          - "ci|5319e7|CI, workflows and repository automation"
          - "module:core|1d76db|Core: config, events, state, notifications, socket, CLI"
          - "module:supervisor|0e8a16|Supervisor module"
          - "module:firewall|e99695|Firewall module"
          - "needs-decision|fbca04|Blocked on a design decision (ADR or decision log)"
          - "good first issue|7057ff|Small, well-scoped task for newcomers"
        cmd: |
          IFS='|' read -r name color desc <<'LABEL'
          {{.ITEM}}
          LABEL
          gh label create "$name" --color "$color" --description "$desc" --force
          echo "label: $name"

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  tidy-check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  build:
    desc: Compile all packages with the release ldflags (binaries are built by snapshot)
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" ./...

  snapshot-tools:
    desc: Build GoReleaser (cached by go run) and install cyclonedx-gomod in bin/tools; snapshot then runs offline
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} --version >/dev/null
      - GOBIN="{{.ROOT_DIR}}/bin/tools" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@{{.CYCLONEDX_GOMOD_VERSION}}

  snapshot-check:
    desc: Validate .goreleaser.yaml
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} check

  snapshot:
    desc: Build release-shaped archives, checksums and SBOMs into dist/ (linux amd64 and arm64; nothing is published)
    env: &release_env
      SENTINEL_VERSION: "{{.VERSION}}"
      SENTINEL_PKG_VERSION: "{{.PKG_VERSION}}"
      SENTINEL_COMMIT: "{{.COMMIT}}"
      SENTINEL_DATE: "{{.DATE}}"
      SOURCE_DATE_EPOCH: "{{.EPOCH}}"
    cmds:
      - task: snapshot-tools
      - task: snapshot-check
      - task: package-script-times
      # One build at a time: archives list the binaries in the order their
      # builds finished, so parallel builds gave tarballs in two orders.
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} release --snapshot --clean --parallelism 1
      - task: snapshot-verify

  package-script-times:
    desc: Give the package scripts the commit's time; nFPM copies a script's mtime into the APK (reproducible packages, D-102)
    internal: true
    env:
      SOURCE_DATE_EPOCH: "{{.EPOCH}}"
    cmds:
      - |
        set -eu
        stamp=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y%m%d%H%M.%S 2>/dev/null || date -u -r "${SOURCE_DATE_EPOCH}" +%Y%m%d%H%M.%S)
        find packaging/scripts -type f -exec env TZ=UTC touch -t "$stamp" {} +

  package-tools:
    desc: Build the image that inspects and lints packages (tests/packaging/Dockerfile); works with local or remote Docker contexts
    internal: true
    cmds:
      # No build context: the Dockerfile copies no files.
      - docker build -q --build-arg BASE={{.PACKAGE_IMAGE_DEBIAN}} -t sentinel-package-tools - < tests/packaging/Dockerfile >/dev/null

  package-verify:
    desc: Check the packages in dist/ (task snapshot first) - files, owners, modes, configuration files, scripts per event, architecture, version, build host and time (D-102)
    deps: [package-tools]
    env: *release_env
    vars:
      # The checker, the scripts it compares and dist/'s packages, on stdin.
      SOURCES: >-
        { {{.TREE}} -- packaging deploy tests/packaging;
        find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \) -print0; } | {{.TAR}}
    cmds:
      - >-
        {{.SOURCES}} | docker run --rm -i --network none
        -e SENTINEL_PKG_VERSION -e SOURCE_DATE_EPOCH sentinel-package-tools
        sh -c 'mkdir -p /tmp/src && tar -xf - -C /tmp/src && bash /tmp/src/tests/packaging/verify_packages.sh /tmp/src /tmp/src/dist'

  package-lint:
    desc: Lint the packages in dist/ with lintian (deb) and rpmlint (rpm) in the package tools image; errors fail, warnings are listed (D-102)
    deps: [package-tools]
    cmds:
      - >-
        { echo tests/packaging/rpmlint.toml | tr '\n' '\0';
        find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -print0; } | {{.TAR}} |
        docker run --rm -i --network none sentinel-package-tools
        sh -c 'mkdir -p /tmp/p && tar -xf - -C /tmp/p && cd /tmp/p &&
        lintian --fail-on error --display-info --pedantic --tag-display-limit 0 dist/*.deb &&
        rpmlint -c tests/packaging/rpmlint.toml dist/*.rpm'

  package-pair:
    desc: Build two package versions for the lifecycle test into dist/lifecycle/{base,next} (0.0.0-pre1, then 0.0.0-pre2 with a different shipped configuration)
    cmds:
      - |
        set -eu
        root=$(mktemp -d)
        trap 'rm -rf "$root"' EXIT
        git clone -q --no-local . "$root/src"
        {{.TREE}} | {{.TAR}} | tar -xf - -C "$root/src"
        rm -rf dist/lifecycle && mkdir -p dist/lifecycle/base dist/lifecycle/next
        (cd "$root/src" && task snapshot PKG_VERSION=0.0.0-pre1 >/dev/null)
        cp "$root"/src/dist/*.deb "$root"/src/dist/*.rpm "$root"/src/dist/*.apk dist/lifecycle/base/
        echo "# lifecycle test: a changed default" >>"$root/src/packaging/sentinel.yaml"
        (cd "$root/src" && task snapshot PKG_VERSION=0.0.0-pre2 >/dev/null)
        cp "$root"/src/dist/*.deb "$root"/src/dist/*.rpm "$root"/src/dist/*.apk dist/lifecycle/next/
        find dist/lifecycle -type f | sort

  test-package:
    desc: Run tests/packaging/lifecycle.sh on a disposable VM over SSH, HOST=<ssh host> [SSH_CONFIG=<file>], with the pair from package-pair; the VM's package manager picks deb, rpm or apk. It installs and removes packages and deletes /etc/sentinel and /var/lib/sentinel there, so it needs SENTINEL_DISPOSABLE_HOST=1 in your environment
    requires:
      vars: [HOST]
    env:
      HOST: "{{.HOST}}"
      SSH_CONFIG: "{{.SSH_CONFIG}}"
    cmds:
      - |
        set -eu
        [ "${SENTINEL_DISPOSABLE_HOST:-}" = 1 ] || { echo "test-package: deletes Sentinel's state on HOST; set SENTINEL_DISPOSABLE_HOST=1 to say it is a disposable VM" >&2; exit 2; }
        case "$HOST" in -*|*[!A-Za-z0-9._@-]*) echo "test-package: HOST must be an ssh host name" >&2; exit 2;; esac
        if [ -n "${SSH_CONFIG:-}" ]; then
          case "$SSH_CONFIG" in *[!A-Za-z0-9._/-]*) echo "test-package: SSH_CONFIG must be a plain path" >&2; exit 2;; esac
          set -- -F "$SSH_CONFIG"
        fi
        rsh() { ssh "$@"; }
        [ -z "${SSH_CONFIG:-}" ] || rsh() { ssh -F "$SSH_CONFIG" "$@"; }
        arch=$(rsh -- "$HOST" uname -m)
        case "$arch" in x86_64|aarch64) ;; *) echo "test-package: unsupported architecture $arch" >&2; exit 2;; esac
        if rsh -- "$HOST" command -v apk >/dev/null 2>&1; then glob="*_${arch}.apk"
        elif rsh -- "$HOST" command -v dpkg >/dev/null 2>&1; then
          case $arch in x86_64) glob="*_amd64.deb" ;; aarch64) glob="*_arm64.deb" ;; esac
        else glob="*.${arch}.rpm"
        fi
        one() { set -- $1; [ $# -eq 1 ] && [ -f "$1" ] || { echo "test-package: want one $*; run task package-pair" >&2; exit 1; }; echo "$1"; }
        base=$(one "dist/lifecycle/base/$glob") next=$(one "dist/lifecycle/next/$glob")
        ext=${glob##*.}
        remote=$(rsh -- "$HOST" mktemp -d /tmp/sentinel-lifecycle.XXXXXX)
        trap 'rsh -- "$HOST" sudo rm -rf "$remote"' EXIT
        # Uploaded through ssh: the file names carry "~", which scp handles badly.
        rsh -- "$HOST" "cat > $remote/base.$ext" < "$base"
        rsh -- "$HOST" "cat > $remote/next.$ext" < "$next"
        rsh -- "$HOST" "cat > $remote/lifecycle.sh" < tests/packaging/lifecycle.sh
        rsh -- "$HOST" sudo SENTINEL_DISPOSABLE_HOST=1 sh "$remote/lifecycle.sh" "$remote/base.$ext" "$remote/next.$ext"

  reproduce:
    desc: Build the snapshot twice from clean copies of the working tree (different paths, time zones and times) and compare every artifact byte for byte (D-079, D-102)
    cmds:
      - |
        set -eu
        root=$(mktemp -d)
        trap 'rm -rf "$root"' EXIT
        for build in one:UTC two:Asia/Tokyo; do
          name=${build%%:*} tz=${build#*:}
          # A clone carries the tags Task derives the version from; the
          # working tree's files go on top, so uncommitted work counts too.
          git clone -q --no-local . "$root/$name/sentinel-watchdog"
          {{.TREE}} | {{.TAR}} | tar -xf - -C "$root/$name/sentinel-watchdog"
          # Every file gets this copy's own time, as a fresh checkout would:
          # the builds must not depend on the source files' times.
          find "$root/$name/sentinel-watchdog" -path '*/.git' -prune -o -type f -exec touch {} +
          (cd "$root/$name/sentinel-watchdog" && TZ=$tz task snapshot >/dev/null)
          sleep 2
        done
        one=$root/one/sentinel-watchdog/dist two=$root/two/sentinel-watchdog/dist
        # GoReleaser's own records name the build directory; they are not published.
        list() { (cd "$1" && find . -maxdepth 1 -type f ! -name artifacts.json ! -name metadata.json ! -name config.yaml | sort); }
        [ "$(list "$one")" = "$(list "$two")" ] || { echo "reproduce: different artifacts" >&2; exit 1; }
        status=0
        list "$one" > "$root/files"
        while IFS= read -r f; do
          cmp -s "$one/$f" "$two/$f" || { echo "reproduce: $f differs" >&2; status=1; }
        done < "$root/files"
        [ "$status" -eq 0 ] && echo "reproduce: $(wc -l < "$root/files" | tr -d ' ') artifacts identical"
        exit "$status"

  snapshot-verify:
    desc: Check dist/ from snapshot - archives, contents, architectures, checksums, SBOMs, embedded version
    env: *release_env
    cmds:
      - |
        set -eu
        cd dist
        fail() { echo "snapshot-verify: $*" >&2; exit 1; }
        version="${SENTINEL_PKG_VERSION}"
        shasum -a 256 -c checksums.txt >/dev/null || fail "checksums do not match"
        set -- *.tar.gz
        [ $# -eq 2 ] || fail "want 2 archives: $*"
        # One package per format and architecture, each in checksums.txt; their
        # contents are checked by package-verify (D-102).
        for pkg in '*_amd64.deb' '*_arm64.deb' '*.x86_64.rpm' '*.aarch64.rpm' '*_x86_64.apk' '*_aarch64.apk'; do
          set -- $pkg
          [ $# -eq 1 ] && [ -f "$1" ] || fail "want one package ${pkg}: $*"
          grep -q " $1\$" checksums.txt || fail "$1 not in checksums.txt"
        done
        set -- *.deb *.rpm *.apk
        [ $# -eq 6 ] || fail "want 6 packages: $*"
        for arch in amd64 arm64; do
          case $arch in amd64) elf="x86-64" machine="x86_64" ;; arm64) elf="aarch64" machine="aarch64" ;; esac
          name="sentinel-watchdog_${version}_linux_${arch}"
          grep -q " ${name}.tar.gz\$" checksums.txt || fail "${name}.tar.gz not in checksums.txt"
          rm -rf "verify-${arch}" && mkdir "verify-${arch}"
          tar -xzf "${name}.tar.gz" -C "verify-${arch}"
          for f in sentineld sentinelctl LICENSE README.md CHANGELOG.md examples/sentinel.yaml deploy/systemd/sentineld.service deploy/openrc/sentineld; do
            [ -f "verify-${arch}/${name}/${f}" ] || fail "${name}: ${f} missing"
          done
          # The OpenRC script must stay executable for a tarball install.
          tar -tvzf "${name}.tar.gz" "${name}/deploy/openrc/sentineld" | grep -q '^-rwxr-xr-x' || fail "${name}: deploy/openrc/sentineld is not 0755"
          for bin in sentineld sentinelctl; do
            path="verify-${arch}/${name}/${bin}"
            file "$path" | grep -q "ELF 64-bit.*${elf}.*statically linked" || fail "${bin} ${arch}: $(file -b "$path")"
            # The version line `task build` links: run where the binary is
            # native (CI), else look for the version in its data (-trimpath
            # keeps -ldflags out of the build information).
            want="${bin} ${SENTINEL_VERSION} (commit ${SENTINEL_COMMIT}, built ${SENTINEL_DATE})"
            case $bin in sentineld) ask="-version" ;; sentinelctl) ask="version" ;; esac
            if [ "$(uname -s)/$(uname -m)" = "Linux/${machine}" ]; then
              [ "$("$path" "$ask")" = "$want" ] || fail "${bin} ${arch}: ${ask} is not \"${want}\""
            else
              LC_ALL=C grep -aq -- "${SENTINEL_VERSION}" "$path" || fail "${bin} ${arch}: version ${SENTINEL_VERSION} not linked"
            fi
            sbom="${bin}_${version}_linux_${arch}.cdx.json"
            jq -e --arg main "github.com/sentinel-watchdog/sentinel-watchdog" --arg target "goarch=${arch}&goos=linux" '
              .bomFormat == "CycloneDX"
              and .metadata.component.name == $main
              and (.metadata.component.purl | contains($target))
              and ([.components[].name] | index("go.yaml.in/yaml/v3") != null)
              and all(.components[]; .purl | contains($target))
            ' "$sbom" >/dev/null || fail "${sbom}: not a CycloneDX SBOM of ${bin} for linux/${arch} with its modules"
            # The generator's own hashes depend on the host that built it.
            jq -e '[.metadata.tools[]? | .hashes] | all(. == null)' "$sbom" >/dev/null \
              || fail "${sbom}: carries the generator's hashes (host-dependent)"
          done
          rm -rf "verify-${arch}"
        done
        echo "snapshot-verify: ok ($(echo *.tar.gz *.deb *.rpm *.apk))"

  lint-shell:
    desc: ShellCheck and shfmt (pinned, go run) on the package scripts and their tests (D-102)
    vars:
      SH_FILES:
        sh: "{{.TREE}} -- packaging/scripts packaging/pkg-version.sh tests/packaging deploy/openrc | tr '\\0' '\\n' | grep -v -e Dockerfile -e '\\.toml$'"
    cmds:
      - shellcheck -s sh $(echo "{{.SH_FILES}}" | grep -v verify_packages.sh)
      - shellcheck tests/packaging/verify_packages.sh
      - go run mvdan.cc/sh/v3/cmd/shfmt@{{.SHFMT_VERSION}} -ci -bn -d {{.SH_FILES | catLines}}

  check:
    desc: Offline CI checks (format, tidy, vet, lint, shell lint, tests, race, build); network checks are vuln and lint-actions
    cmds:
      - task: fmt-check
      - task: tidy-check
      - task: vet
      - task: lint
      - task: lint-shell
      - task: test
      - task: test-race
      - task: build

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin dist coverage.out coverage.html
