# GoReleaser: release-shaped snapshot builds and packages (D-024, D-079,
# D-102). Run through Task, which resolves the build metadata once for every
# build path: `task snapshot` (and `task snapshot-verify`). Nothing is
# published: GoReleaser never talks to GitHub (release.disable below).
version: 2

project_name: sentinel-watchdog

builds:
  - &build
    id: sentineld
    main: ./cmd/sentineld
    binary: sentineld
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0] # static binaries (D-023)
    flags: [-trimpath]
    # The same ldflags as `task build` (Taskfile.yml LDFLAGS), from the
    # values Task resolved: one source of version, commit and date.
    ldflags:
      - -s -w
      - -X github.com/sentinel-watchdog/sentinel-watchdog/internal/version.Version={{ .Env.SENTINEL_VERSION }}
      - -X github.com/sentinel-watchdog/sentinel-watchdog/internal/version.Commit={{ .Env.SENTINEL_COMMIT }}
      - -X github.com/sentinel-watchdog/sentinel-watchdog/internal/version.Date={{ .Env.SENTINEL_DATE }}
    mod_timestamp: "{{ .Env.SOURCE_DATE_EPOCH }}" # reproducible: no build time
  - <<: *build
    id: sentinelctl
    main: ./cmd/sentinelctl
    binary: sentinelctl

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    # Fixed owner and times: the archive bytes do not depend on who built
    # it, where or when.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .Env.SENTINEL_DATE }}"
    files:
      - src: LICENSE
        info: &file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.SENTINEL_DATE }}"
      - src: README.md
        info: *file_info
      - src: CHANGELOG.md
        info: *file_info
      # A reference to read, not a ready configuration: it names groups and
      # webhook variables a host may not have (docs/operations.md).
      - src: configs/sentinel.yaml
        dst: examples
        strip_parent: true
        info: *file_info
      - src: configs/supervisor/http.yaml
        dst: examples/supervisor
        strip_parent: true
        info: *file_info
      - src: configs/supervisor/process.yaml
        dst: examples/supervisor
        strip_parent: true
        info: *file_info
      - src: configs/supervisor/systemd.yaml
        dst: examples/supervisor
        strip_parent: true
        info: *file_info
      - src: configs/supervisor/jobs.yaml
        dst: examples/supervisor
        strip_parent: true
        info: *file_info
      # The init files an operator installs by hand (docs/operations.md).
      - src: deploy/systemd/sentineld.service
        dst: deploy/systemd
        strip_parent: true
        info: *file_info
      - src: deploy/openrc/sentineld
        dst: deploy/openrc
        strip_parent: true
        info:
          <<: *file_info
          mode: 0755

# DEB, RPM and APK packages (D-102): the same binaries as the archives, the
# init file of each family, the installed configuration and the maintainer
# scripts. No dependencies: the binaries are static (D-023).
nfpms:
  - id: packages
    package_name: sentinel-watchdog
    ids: [sentineld, sentinelctl]
    formats: [deb, rpm, apk]
    # deb: name_version_arch.deb, rpm: name-version-1.arch.rpm, apk: name_version_arch.apk
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Sentinel Watchdog
    homepage: https://github.com/sentinel-watchdog/sentinel-watchdog
    # The package's contact (D-102); it can change in any release.
    maintainer: Marco Da Re <marco@mrcdare.dev>
    description: |-
      Agent that supervises services and jobs on a Linux host
      sentineld watches HTTP endpoints, processes, systemd units and scheduled
      jobs, recovers them within a budget, and reports through events,
      notifications, an audit log and the sentinelctl command. It runs as root
      and changes nothing until a module is enabled in /etc/sentinel.
    license: Apache-2.0
    section: admin
    priority: optional
    bindir: /usr/bin
    # Reproducible: every time in the package is the commit's.
    mtime: "{{ .Env.SENTINEL_DATE }}"
    contents:
      - dst: /etc/sentinel
        type: dir
        file_info: &pkg_dir
          mode: 0750
          owner: root
          group: root
          mtime: "{{ .Env.SENTINEL_DATE }}"
      - src: packaging/sentinel.yaml
        dst: /etc/sentinel/sentinel.yaml
        type: config|noreplace
        file_info:
          <<: *pkg_dir
          mode: 0640
      - src: deploy/systemd/sentineld.service
        dst: /usr/lib/systemd/system/sentineld.service
        packager: deb
        file_info: &pkg_file
          <<: *pkg_dir
          mode: 0644
      - src: deploy/systemd/sentineld.service
        dst: /usr/lib/systemd/system/sentineld.service
        packager: rpm
        file_info: *pkg_file
      - src: deploy/openrc/sentineld
        dst: /etc/init.d/sentineld
        packager: apk
        file_info:
          <<: *pkg_dir
          mode: 0755
      - src: README.md
        dst: /usr/share/doc/sentinel-watchdog/README.md
        file_info: *pkg_file
      - src: CHANGELOG.md
        dst: /usr/share/doc/sentinel-watchdog/CHANGELOG.md
        file_info: *pkg_file
      - src: configs/sentinel.yaml
        dst: /usr/share/doc/sentinel-watchdog/examples/sentinel.yaml
        file_info: *pkg_file
      - src: configs/supervisor/http.yaml
        dst: /usr/share/doc/sentinel-watchdog/examples/supervisor/http.yaml
        file_info: *pkg_file
      - src: configs/supervisor/process.yaml
        dst: /usr/share/doc/sentinel-watchdog/examples/supervisor/process.yaml
        file_info: *pkg_file
      - src: configs/supervisor/systemd.yaml
        dst: /usr/share/doc/sentinel-watchdog/examples/supervisor/systemd.yaml
        file_info: *pkg_file
      - src: configs/supervisor/jobs.yaml
        dst: /usr/share/doc/sentinel-watchdog/examples/supervisor/jobs.yaml
        file_info: *pkg_file
      - src: packaging/debian/copyright
        dst: /usr/share/doc/sentinel-watchdog/copyright
        packager: deb
        file_info: *pkg_file
      - src: packaging/debian/lintian-overrides
        dst: /usr/share/lintian/overrides/sentinel-watchdog
        packager: deb
        file_info: *pkg_file
      - src: LICENSE
        dst: /usr/share/licenses/sentinel-watchdog/LICENSE
        type: license
        packager: rpm
        file_info: *pkg_file
      - src: LICENSE
        dst: /usr/share/licenses/sentinel-watchdog/LICENSE
        packager: apk
        file_info: *pkg_file
    # One script per event, bound explicitly for each format (D-102; their
    # arguments differ). preinstall.sh ignores its arguments and runs before
    # every install and upgrade. Task gives the scripts the commit's mtime
    # before this runs: nFPM copies it into the APK.
    overrides:
      deb:
        scripts:
          preinstall: packaging/scripts/preinstall.sh
          postinstall: packaging/scripts/deb/postinst
          preremove: packaging/scripts/deb/prerm
          postremove: packaging/scripts/deb/postrm
      rpm:
        scripts:
          preinstall: packaging/scripts/preinstall.sh
          postinstall: packaging/scripts/rpm/post
          preremove: packaging/scripts/rpm/preun
          postremove: packaging/scripts/rpm/postun
      apk:
        scripts:
          preinstall: packaging/scripts/preinstall.sh
          preremove: packaging/scripts/apk/pre-deinstall
    apk:
      scripts:
        preupgrade: packaging/scripts/preinstall.sh
        postupgrade: packaging/scripts/apk/post-upgrade
    rpm:
      summary: Agent that supervises services and jobs on a Linux host
      group: System Environment/Daemons
      # The default is the build machine's name: fixed for reproducibility.
      buildhost: sentinel-watchdog

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One CycloneDX SBOM per binary, from the Go build information embedded in
# it: exactly the modules linked into that artifact, read offline. No
# serial number, timestamp or hashes of the generator itself (they depend
# on the host that built it; name and version stay), so the same binary
# gives the same SBOM on any machine. The generator is the pinned build
# that `task snapshot-tools` installs (a `go run` would take GOOS/GOARCH
# for itself); it runs in dist/, and GOOS/GOARCH give its package URLs the
# target platform instead of the host's.
sboms:
  - id: binaries
    artifacts: binary
    documents: ["{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.cdx.json"]
    cmd: sh
    env: # the command gets only these: PATH finds sh and jq
      - PATH={{ .Env.PATH }}
      - GOOS={{ .Os }}
      - GOARCH={{ .Arch }}
    args:
      # GoReleaser expands $artifact and $document (any $NAME, in fact)
      # before sh runs, so the script uses no shell variables.
      - -c
      - >-
        ../bin/tools/cyclonedx-gomod bin -json -std -noserial -notimestamp -output "$document.raw" "$artifact"
        && jq 'del(.metadata.tools[]?.hashes)' "$document.raw" > "$document"
        && rm "$document.raw"

# Snapshot artifacts carry the package version Task derives (D-102): the next
# patch with "-pre<commits since the tag>", valid and ordered for dpkg, rpm
# and apk (deb 0.3.2~pre5, rpm 0.3.2~pre5-1, apk 0.3.2_pre5).
snapshot:
  version_template: "{{ .Env.SENTINEL_PKG_VERSION }}"

changelog:
  disable: true

release:
  disable: true
