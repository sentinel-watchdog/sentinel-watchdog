# golangci-lint v2 configuration.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # Reading files whose paths come from the operator's configuration
        # is the point of a config loader / state store.
        - G304
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: receiver-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/sentinel-watchdog/sentinel-watchdog
